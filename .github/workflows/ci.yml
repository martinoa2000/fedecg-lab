name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI is deliberately cheap: it lints and runs the fast unit tests. It never
# downloads PTB-XL and never trains a model, so it finishes in a couple of
# minutes on a free runner. Tests that need the dataset are marked
# `needs_data` and are excluded here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -m "not slow and not needs_data"
