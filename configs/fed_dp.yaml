# Phase 6: settings shared by every federated differentially private run.
#
# Five IID hospitals (as in fedavg_iid_5.yaml), each running DP-SGD on its own
# ~3,400 records. Per-hospital batches stay at 256 so every round still takes
# ~13 noisy steps; 1,024 would leave three. The learning rate is the best one
# found for batch 256 on the validation fold. `fed_dp_none.yaml` is the
# same recipe without privacy.

extends: fedavg_iid_5.yaml

training:
  augment: {amplitude: 0.0, noise: 0.0, wander: 0.0, lead_dropout: 0.0}
  batch_size: 256
  epochs: 30
  learning_rate: 0.01

federated:
  rounds: 30

# DP-SGD keeps the network it was tuned with. Per-record gradients of the
# tuned 64-channel model at batch 1,024 need ~15 GB (hours per epoch on a
# laptop), and noise is added in every parameter's direction, so wider
# networks tend to fare worse under DP. Each DP run is measured against a
# no-privacy control with this same network.
model:
  base_channels: 32

privacy:
  enabled: true
